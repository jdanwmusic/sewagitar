# ============================================================
# SEWAGITAR.COM - Cloudflare deployment configuration
# ============================================================
#
# PROJECT: Static Next.js site (output: export)
# Build output directory: /out (contains pure static HTML/CSS/JS)
# Deployment: Cloudflare Workers static assets (no Worker functions)
#
# `npx wrangler deploy` reads this file. Because the project is a
# PURE STATIC SITE, we use the `assets` directive to point at the
# build output directory. No `main` Worker entry-point is needed.
#
# not_found_handling = "single-page-application" serves index.html
# as the fallback for unknown routes (SPA-style).
# ============================================================

name = "sewagitar"
compatibility_date = "2024-11-01"

# Static assets served directly from the Next.js export build.
assets = { directory = "./out", not_found_handling = "single-page-application" }